# Dependabot opens a pull request when a dependency has a security fix or a
# new version: Python packages, npm packages, and the GitHub Actions used by
# the workflows. Weekly, grouped, so it's one PR per ecosystem.
version: 2
updates:
  - package-ecosystem: pip
    directory: /server
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /client
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
