# Dependabot opens pull requests for outdated or vulnerable dependencies:
# Python packages, npm packages, and the GitHub Actions the workflows use.
# Weekly. Minor and patch updates are grouped into one PR per ecosystem and
# merge themselves once the tests pass (tests.yml). Each major update gets
# its own PR and waits for a person, since a breaking change can pass the
# tests and still break the site.
version: 2
updates:
  - package-ecosystem: pip
    directory: /server
    schedule:
      interval: weekly
    groups:
      python-minor-and-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: npm
    directory: /client
    schedule:
      interval: weekly
    groups:
      npm-minor-and-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions-minor-and-patch:
        update-types: ["minor", "patch"]
