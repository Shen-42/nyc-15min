# Card 15, task 1: measure what a five-borough walking graph would cost the
# server. Downloads all five boroughs from OpenStreetMap and prints memory,
# load time, and search speed for the current format and NumPy arrays.
# Changes nothing in the repo. Run it from the Actions tab:
# "Measure five boroughs" > "Run workflow". The table is on the run's summary page.
name: Measure five boroughs

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  measure:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    defaults:
      run:
        working-directory: server
    env:
      # Same Overpass servers as the monthly refresh (see refresh-data.yml).
      OVERPASS_URLS: ${{ secrets.OVERPASS_URLS }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: server/requirements*.txt

      # Keep the Overpass downloads between runs, so a rerun takes minutes
      # instead of the two-plus hours the first download took.
      - uses: actions/cache@v4
        with:
          path: server/cache
          key: overpass-five-boroughs-${{ hashFiles('server/scripts/measure_five_boroughs.py') }}
          restore-keys: overpass-five-boroughs-

      - name: Install
        run: pip install -r requirements.txt -r requirements-build.txt scipy

      - name: Download and measure
        run: |
          set -o pipefail
          # -u: print each line right away, so the log stays in order.
          python -u scripts/measure_five_boroughs.py 2>&1 | tee "$RUNNER_TEMP/out.txt"

      - name: Write the results to the summary
        if: always()
        run: |
          {
            echo "## Five boroughs"
            echo '```'
            grep -E "boundary covers|nodes, .* edges in|Dropped|^Saved" "$RUNNER_TEMP/out.txt" || true
            echo
            sed -n '/^Graph:/,$p' "$RUNNER_TEMP/out.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
