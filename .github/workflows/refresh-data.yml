# Monthly data refresh (cards 8 and 15).
# Re-downloads the five boroughs' streets, lakes, places, and curb ramps,
# checks that nothing shrank suspiciously, and runs the tests. Then it
# uploads the data to a GitHub release and commits server/data-release.json,
# which names that release. The commit makes Render redeploy the API, and
# its build downloads the new data (server/scripts/get_data.py).
# Run it by hand from the repo's Actions tab: "Refresh map data" > "Run workflow".
# "What to rebuild" picks how much (the monthly run does everything):
#   everything       streets, lakes, places, curb ramps, grid: about 4 hours
#   places and grid  lakes, places, and the grid, keeping the release's
#                    streets and curb ramps: under an hour
#   grid only        the grid, from the release's data: about 5 minutes
name: Refresh map data

on:
  schedule:
    - cron: "0 7 1 * *" # 07:00 UTC on the 1st of every month
  workflow_dispatch:
    inputs:
      scope:
        description: "What to rebuild"
        type: choice
        options: [everything, places and grid, grid only]
        default: everything

permissions:
  contents: write # to create the release and commit data-release.json

jobs:
  refresh:
    # Pinned so the move of ubuntu-latest to Ubuntu 26 can't change things unexpectedly.
    runs-on: ubuntu-24.04
    # The city's walking graph takes about 2 hours from public Overpass
    # servers. GitHub stops a job at 6 hours.
    timeout-minutes: 330
    defaults:
      run:
        working-directory: server
    env:
      # Optional repo secret: Overpass servers to try, comma-separated, e.g. a
      # NextGIS server with a free key first. Empty means the public defaults
      # in server/scripts/overpass.py.
      OVERPASS_URLS: ${{ secrets.OVERPASS_URLS }}
      # The monthly run has no inputs, so it rebuilds everything.
      SCOPE: ${{ inputs.scope || 'everything' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: server/requirements*.txt

      - name: Install
        run: pip install -r requirements.txt -r requirements-build.txt

      - name: Get the current data
        run: python scripts/get_data.py

      - name: Save current counts
        run: python scripts/check_data.py --snapshot "$RUNNER_TEMP/before.json"

      # Overpass answers saved by an earlier try of this same run, so
      # "Re-run failed jobs" picks up where it stopped instead of starting over.
      - name: Restore this run's downloads
        if: env.SCOPE != 'grid only'
        uses: actions/cache/restore@v6
        with:
          path: server/cache
          key: overpass-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: overpass-${{ github.run_id }}-

      # Public Overpass servers are often busy. Each request retries with
      # growing waits and alternates servers (see server/scripts/overpass.py).
      - name: Download walking graph
        if: env.SCOPE == 'everything'
        run: python scripts/build_graph.py

      - name: Download lakes and ponds
        if: env.SCOPE != 'grid only'
        run: python scripts/build_water.py

      # Same download as the lakes (scripts/osm_places.py), so mostly from the cache.
      - name: Download places
        if: env.SCOPE != 'grid only'
        run: python scripts/build_amenities.py

      - name: Save this run's downloads
        if: always() && env.SCOPE != 'grid only'
        uses: actions/cache/save@v6
        with:
          path: server/cache
          key: overpass-${{ github.run_id }}-${{ github.run_attempt }}

      # NYC Open Data, not Overpass. Needs the new graph's street corners.
      - name: Download curb ramps
        if: env.SCOPE == 'everything'
        run: python scripts/build_ramps.py

      # The background job for cards 12 and 15: score every 100 m of the city
      # with the new data and find the gaps in each borough. About 3 minutes.
      - name: Score the city grid
        run: python scripts/build_grid.py

      - name: Check the new data
        run: python scripts/check_data.py --compare "$RUNNER_TEMP/before.json"

      - name: Run tests
        run: pytest

      - name: Publish the data and commit data-release.json
        run: |
          TAG="data-$(date -u +%Y-%m-%d)-${{ github.run_number }}"
          python scripts/get_data.py --pin "$TAG"
          FILES=$(python -c 'import sys; sys.path.insert(0, "scripts"); import get_data; print(" ".join("data/" + f for f in get_data.FILES))')

          # Same fingerprints as the data already in use: nothing to publish.
          if git show HEAD:server/data-release.json > "$RUNNER_TEMP/old.json" 2>/dev/null \
             && [ "$(jq -S .files "$RUNNER_TEMP/old.json")" = "$(jq -S .files data-release.json)" ]; then
            git checkout data-release.json
            echo "Nothing changed." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          gh release create "$TAG" $FILES \
            --title "Map data $(date -u +%Y-%m-%d)" \
            --notes "Built by run ${{ github.run_number }} of the Refresh map data workflow. Download with server/scripts/get_data.py."

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # The data lives in releases now; stop tracking any copies still in git.
          git rm -r --cached --quiet --ignore-unmatch data
          git add data-release.json
          git commit -m "Monthly data refresh $(date -u +%Y-%m-%d): use release $TAG"
          # Someone may have pushed to main while this job ran. Put this
          # commit on top of theirs; it only touches server/data-release.json.
          git pull --rebase origin main
          git push
          echo "Published release $TAG and committed data-release.json. Render will redeploy the API." >> "$GITHUB_STEP_SUMMARY"

      # Keep the three newest data releases (about 150 MB); older ones only
      # matter for going back, and git history still says what they were.
      - name: Delete old data releases
        run: |
          gh release list --limit 100 --json tagName --jq '.[].tagName' \
            | grep '^data-' | tail -n +4 \
            | xargs -r -n 1 gh release delete --cleanup-tag --yes
