# Monthly data refresh (card 8).
# Re-downloads Manhattan's streets, lakes, and places from OpenStreetMap,
# checks that nothing shrank suspiciously, runs the tests, and commits the
# new data. The commit makes Render redeploy the API with it.
# Run it by hand from the repo's Actions tab: "Refresh map data" > "Run workflow".
name: Refresh map data

on:
  schedule:
    - cron: "0 7 1 * *" # 07:00 UTC on the 1st of every month
  workflow_dispatch:

permissions:
  contents: write # to commit the new data

jobs:
  refresh:
    # Pinned so the move of ubuntu-latest to Ubuntu 26 can't change things unexpectedly.
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    defaults:
      run:
        working-directory: server
    env:
      # Optional repo secret: Overpass servers to try, comma-separated, e.g. a
      # NextGIS server with a free key first. Empty means the public defaults
      # in server/scripts/overpass.py.
      OVERPASS_URLS: ${{ secrets.OVERPASS_URLS }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: server/requirements*.txt

      - name: Install
        run: pip install -r requirements.txt -r requirements-build.txt

      - name: Save current counts
        run: python scripts/check_data.py --snapshot "$RUNNER_TEMP/before.json"

      # Public Overpass servers are often busy. Each request retries with
      # growing waits and alternates servers (see server/scripts/overpass.py).
      - name: Download walking graph
        run: python scripts/build_graph.py

      - name: Download lakes and ponds
        run: python scripts/build_water.py

      - name: Download places
        run: python scripts/build_amenities.py

      - name: Check the new data
        run: python scripts/check_data.py --compare "$RUNNER_TEMP/before.json"

      - name: Run tests
        run: pytest

      - name: Commit new data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Nothing changed." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git commit -m "Monthly data refresh $(date -u +%Y-%m-%d)"
          # Someone may have pushed to main while this job ran. Put this
          # commit on top of theirs; it only touches server/data/.
          git pull --rebase origin main
          git push
          echo "Committed new data. Render will redeploy the API." >> "$GITHUB_STEP_SUMMARY"
