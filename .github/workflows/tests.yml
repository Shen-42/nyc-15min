# Runs every test, and builds the site, on each pull request and each push
# to main, so every PR shows a check mark or a cross.
# For Dependabot's PRs it then goes one step further (the automerge job):
# minor and patch updates that pass are merged, which makes Render deploy
# them; major updates get a comment and wait for a person.
name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  server:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: server/requirements*.txt
      - run: pip install -r requirements.txt
      - run: pytest

  client:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  automerge:
    # Only Dependabot's PRs, and only after both test jobs passed.
    needs: [server, client]
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    env:
      PR_URL: ${{ github.event.pull_request.html_url }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Read what the update changes
        id: meta
        uses: dependabot/fetch-metadata@v2

      # Only updates Dependabot says are minor or patch. If it can't tell
      # (it sometimes can't for ">=" requirements), a person decides.
      - name: Merge minor and patch updates
        if: steps.meta.outputs.update-type == 'version-update:semver-minor' || steps.meta.outputs.update-type == 'version-update:semver-patch'
        run: |
          # Several updates often pass at the same moment; GitHub refuses
          # all but the first ("Base branch was modified"). Wait and retry.
          for attempt in 1 2 3 4 5; do
            if gh pr merge --squash --delete-branch "$PR_URL"; then
              echo "Merged: ${{ steps.meta.outputs.dependency-names }}" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "Merge attempt $attempt didn't go through; trying again shortly."
            sleep $((attempt * 20))
          done
          exit 1

      - name: Leave major or unclear updates for a person
        if: steps.meta.outputs.update-type != 'version-update:semver-minor' && steps.meta.outputs.update-type != 'version-update:semver-patch'
        run: |
          gh pr comment "$PR_URL" --body "Tests pass, but this update (${{ steps.meta.outputs.dependency-names }}) is a major version or Dependabot couldn't tell, so it wasn't merged automatically. Check the release notes, try the site with it if it touches the site, then merge or close."
