# Render Blueprint: creates both services from this file.
# In the Render dashboard: New > Blueprint > pick this repo.
services:
  # The FastAPI server. Free plan: 512 MB RAM, sleeps after 15 minutes
  # without visits and takes about a minute to wake.
  - type: web
    name: nyc-15min-api
    runtime: python
    plan: free
    rootDir: server
    buildCommand: pip install -r requirements.txt
    # The rate limit counts searches per visitor IP. It reads the address
    # from X-Forwarded-For itself (main.py, client_ip), counting from the end
    # so a visitor can't fake it. Uvicorn is not told to trust that header.
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.8
      # The site's address, e.g. https://nyc-15min.onrender.com
      - key: ALLOWED_ORIGINS
        sync: false
      # Where the rate limit keeps its counts (see server/rate_limit.py).
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: nyc-15min-limits
          property: connectionString
      # Accounts (card 13, see server/accounts.py). Set the values in the
      # dashboard; the secret key must never reach the browser or GitHub.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: ADMIN_USER_IDS
        sync: false
      # A fine-grained GitHub token that can run this repo's Actions, for
      # the admin's "Start data refresh" button.
      - key: GH_REFRESH_TOKEN
        sync: false
      - key: GH_REPO
        value: Shen-42/nyc-15min

  # Redis-compatible store for rate-limit counts. Free plan: in memory only,
  # which is fine because the counts only matter for a minute.
  - type: keyvalue
    name: nyc-15min-limits
    plan: free
    ipAllowList: [] # only the API, over Render's private network

  # The React site, served as static files from Render's CDN. Always on.
  - type: web
    name: nyc-15min
    runtime: static
    buildCommand: cd client && npm ci && npm run build
    staticPublishPath: client/dist
    # Security headers for every page. The Content-Security-Policy lists the
    # only places the site may load from or talk to: itself, the map tiles,
    # the API, and Supabase (sign-in). Anything else, such as a script
    # injected into the page, is blocked. 'unsafe-inline' for styles is
    # needed by Leaflet and by React's style attributes; scripts get no such
    # exception. frame-ancestors 'none' stops other sites from framing it.
    headers:
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://tiles.stadiamaps.com; font-src 'self' data:; connect-src 'self' https://nyc-15min-api.onrender.com https://*.supabase.co; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: "camera=(), microphone=(), geolocation=(), payment=()"
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000
    envVars:
      - key: NODE_VERSION
        value: "22"
      # The API's address, e.g. https://nyc-15min-api.onrender.com
      - key: VITE_API_URL
        sync: false
      # Sign-in (card 13). The publishable key is public by design.
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_PUBLISHABLE_KEY
        sync: false
